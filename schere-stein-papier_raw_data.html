<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Schere, Stein, Papier</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f4f8;
      margin-top: 50px;
    }
    button {
      font-size: 40px;
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      border-radius: 10px;
      border: 2px solid #333;
      background-color: white;
    }
    button:hover {
      background-color: #ddd;
    }
    #ergebnis {
      font-size: 24px;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Schere, Stein, Papier</h1>
  <p>Wähle deinen Zug:</p>

  <!-- Jeder Knopf ruft die Funktion spielen() mit seiner Wahl auf -->
  <button onclick="spielen('Schere')">✂️</button>
  <button onclick="spielen('Stein')">🪨</button>
  <button onclick="spielen('Papier')">📄</button>

  <p id="auswahl"></p>
  <p id="ergebnis"></p>
  <p>Du: <span id="punkteSpieler">0</span> | Computer: <span id="punkteComputer">0</span></p>

  <script>
    let punkteSpieler = 0;
    let punkteComputer = 0;
    function spielen(spielerWahl) {
      const moeglichkeiten = ['Schere', 'Stein', 'Papier'];
      const zufallsZahl = Math.floor(Math.random() * 3);
      const computerWahl = moeglichkeiten[zufallsZahl];
      console.log(computerWahl);
      
      let ergebnis;
      if (spielerWahl === computerWahl) {
        ergebnis = "Unentschieden!";
      } else if (
        (spielerWahl === 'Schere' && computerWahl === 'Papier') ||
        (spielerWahl === 'Stein' && computerWahl === 'Schere') ||
        (spielerWahl === 'Papier' && computerWahl === 'Stein')
      ) {
        ergebnis = "Du gewinnst!";
        punkteSpieler = punkteSpieler + 1;
      } else {
        ergebnis = "Computer gewinnt!";
        punkteComputer = punkteComputer + 1;
      }
      
          // 3. Ergebnis auf der Seite anzeigen
      document.getElementById('ergebnis').textContent = ergebnis;
      document.getElementById('punkteSpieler').textContent = punkteSpieler;
      document.getElementById('punkteComputer').textContent = punkteComputer;
      document.getElementById('auswahl').textContent = 'Du: ' + spielerWahl + ' – Computer: ' + computerWahl;


    }

  </script>

</body>
</html>
